# senet.hoodrun.io
#
# Install it at /etc/nginx/sites-available/senet and link it from
# /etc/nginx/sites-enabled/.
#
# The host already serves several other names from this nginx. Senet joins that
# server, and it does not start a second one. Certbot issues the certificate,
# which is how every other name on this host works.
#
# Four rules matter, and each one breaks something that is hard to diagnose:
#
# - WebAuthn refuses to run without a valid certificate for this exact name. A
#   passkey also binds to the origin that created it, so this name must serve
#   the application for as long as the accounts live.
# - `/sw.js` must never come from a cache, or a new build cannot reach a device
#   that already installed the old worker.
# - The `Service-Worker-Allowed` header lets the worker control the whole
#   origin.
# - A third-party wallet reads `stellar.toml` from its own page, so that file
#   needs a permissive cross-origin header.

server {
    listen 80;
    listen [::]:80;
    server_name senet.hoodrun.io;

    # Certbot writes its challenge here and rewrites this block on issue.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.18 on this host takes http2 as a listen parameter, not a directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name senet.hoodrun.io;

    ssl_certificate     /etc/letsencrypt/live/senet.hoodrun.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senet.hoodrun.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A link, which a deployment renames in one step. nginx follows it for
    # every request, so a release arrives whole or not at all.
    root /opt/senet/live;
    index index.html;

    include /etc/nginx/snippets/senet-common-headers.conf;

    # SEP-1. A wallet fetches this from its own origin, so it needs the header.
    location = /.well-known/stellar.toml {
        include /etc/nginx/snippets/senet-common-headers.conf;
        alias /opt/senet/service/deploy/stellar.toml;
        default_type "text/plain; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/senet-common-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/senet-common-headers.conf;
        default_type "application/manifest+json";
        add_header Cache-Control "no-cache" always;
    }

    # No file in the build carries its content hash in its name, so the browser
    # must revalidate each one.
    location ~ ^/(index\.html|app\.js|app\.css|icon\.svg|release\.json)$ {
        include /etc/nginx/snippets/senet-common-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append. `$proxy_add_x_forwarded_for` adds the
        # real client to whatever the client already sent. The service reads the
        # first entry, so a caller who sends this header names itself.
        #
        # That made the budget on `/api/redemption` evadable from the public
        # network. Two measurements: the service refused three of fifteen
        # requests from one forged address, and none of fifteen requests from
        # fifteen forged addresses. Each request spends a read against the RPC.
        #
        # One proxy stands in front of this service, so there is no chain worth
        # keeping. `$remote_addr` is the address that opened the connection to
        # this server, and a client cannot set it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One redemption waits for simulation and for submission. It then polls
        # for up to thirty seconds.
        proxy_read_timeout 120s;
    }

    # Every other path is the shell of the single-page application.
    location / {
        include /etc/nginx/snippets/senet-common-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
