# The headers that every response from senet.hoodrun.io carries.
#
# nginx drops the `add_header` directives of a parent block inside any location
# that adds a header of its own. A location that sets a cache rule would
# therefore lose these three without noticing. Each location includes this file
# instead, so the headers reach every response.

# The camera is the only input device of the merchant screen, and the payer
# screen asks for a passkey.
add_header Permissions-Policy "camera=(self), publickey-credentials-get=(self)" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
